<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#147a42">
  <title>Catálogo de produtos | Smart Guide</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/catalogo.css">
</head>
<body data-page="catalog">
  <div id="site-header"></div>
  <main class="page-shell">
    <section class="page-intro">
      <span class="eyebrow">ENCONTRE O QUE PRECISA</span>
      <h1>Catálogo de Produtos</h1>
      <p>Explore produtos para tirar seu projeto do papel.</p>
    </section>
    <section class="catalog-toolbar panel" aria-label="Filtros do catálogo">
      <label class="search-field"><span aria-hidden="true">⌕</span><span class="sr-only">Pesquisar produtos</span><input id="product-search" type="search" placeholder="Buscar por nome ou descrição..."></label>
      <label class="category-select"><span class="sr-only">Filtrar por categoria</span><select id="category-filter"><option value="">Todas as categorias</option></select></label>
    </section>
    <p id="catalog-status" class="page-status" role="status"></p>
    <section id="product-grid" class="product-grid" aria-live="polite"></section>
  </main>
  <dialog id="product-dialog" class="product-dialog" aria-labelledby="dialog-title">
    <button class="dialog-close" type="button" aria-label="Fechar detalhes">×</button>
    <div id="dialog-content"></div>
  </dialog>
  <div id="site-footer"></div>
  <script src="js/demo-data.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/list-store.js" defer></script>
  <script src="js/shared.js" defer></script>
  <script src="js/catalogo.js" defer></script>
</body>
</html>
