# Perfil local de demonstracao.
# Sobe um banco H2 em memoria no modo Oracle, para validar o frontend
# sem depender das credenciais do Oracle Database.
spring.datasource.url=jdbc:h2:mem:smartguide;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# O schema local e criado a partir das entidades e descartado ao encerrar.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
