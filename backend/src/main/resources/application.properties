spring.application.name=smart-guide-backend
server.port=8080

# Perfil ativo por padrao: "demo" (banco local em memoria, sem credenciais).
# Para usar o Oracle, ative o perfil "oracle" e defina as variaveis de ambiente.
spring.profiles.default=demo

# ---------------------------------------------------------------
# Conexao com o Oracle Database
# Nenhuma credencial fica no codigo: os valores vem do ambiente.
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# O schema e criado e populado pelo script SQL do projeto.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.sql.init.mode=never

# ---------------------------------------------------------------
# CORS
# localhost e 127.0.0.1 (qualquer porta) sao liberados por padrao.
# Origens extras podem ser informadas separadas por virgula.
# ---------------------------------------------------------------
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:}
